name: CI Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. BACKEND CI (Python 3.12 + FastAPI + UV + Ruff + Pytest)
  # ----------------------------------------------------------------------------
  ci-backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Lint and Format Check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type Check (Mypy)
        run: uv run mypy app

      - name: Validate Chapter Content Integrity
        run: uv run python scripts/validate_content.py

      - name: Run Unit & Integration Tests (Pytest)
        run: uv run pytest -m "not db_integration" tests/ || uv run pytest tests/test_init.py tests/test_health.py tests/test_content_validation.py

  # ----------------------------------------------------------------------------
  # 2. FRONTEND CI (Node.js 20 + Vite + React 19 + TypeScript)
  # ----------------------------------------------------------------------------
  ci-frontend:
    name: Frontend (Vite / React 19 / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npx oxlint src

      - name: Production Build (TypeScript + Vite)
        run: npm run build
