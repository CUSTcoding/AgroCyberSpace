services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
      args:
        UV_SYNC_ARGS: --no-dev
    image: agrosight-backend:local
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  backend_storage:
